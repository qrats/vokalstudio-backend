name: vokalstudio-backend-pipeline

on:
  push:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-latest

    # Deploying needs HOST/USERNAME/PORT/SSHKEY. Without them the scp step
    # fails on every push, so the job is opted into with a repository variable
    # and otherwise reports as skipped.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}

    steps:
    - uses: actions/checkout@v1

    - name: Copy file via scp
      uses: appleboy/scp-action@master
      env:
        HOST: ${{ secrets.HOST }}
        USERNAME: ${{ secrets.USERNAME }}
        PORT: ${{ secrets.PORT }}
        KEY: ${{ secrets.SSHKEY }}
      with:
        source: "."
        target: "/var/www/vokalstudio/backend"

    - name: Executing remote command
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        USERNAME: ${{ secrets.USERNAME }}
        PORT: ${{ secrets.PORT }}
        KEY: ${{ secrets.SSHKEY }}
        script: sh /var/www/vokalstudio/backend/deploy.sh;