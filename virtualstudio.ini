[uwsgi]
module = app:app

processes = 5

socket = virtualstudio.sock
chmod-socket = 666
vacuum = true

die-on-term = true

lazy-apps = true

harakiri = 3600
socket-timeout = 3600
chunked-input-timeout = 3600
http-timeout = 3600

req-logger = file:/var/www/virtualstudio/logs/uwsgi/req.log
logger = file:/var/www/virtualstudio/logs/uwsgi/error.log
